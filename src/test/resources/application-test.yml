spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-testing-purposes-only-256bit
  expiration: 3600000
  refresh-expiration: 7200000

app:
  mail:
    enabled: false
  frontend-url: http://localhost:5173

logging:
  level:
    root: WARN
    com.kanban: INFO
