spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kanbandb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

  # Fill username/password, then restart. Use a Gmail App Password, not your normal password.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

logging:
  level:
    root: INFO
    com.kanban: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: ${JWT_SECRET:}

app:
  mail:
    enabled: true
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@dinacharya.local}}
  frontend-url: http://localhost:5173
  admin:
    email: ${ADMIN_EMAIL:admin@taskhub.com}
    password: ${ADMIN_PASSWORD:}
    enabled: ${ADMIN_ENABLED:true}
